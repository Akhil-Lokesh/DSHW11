name: ML Model CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      working-directory: ./mlops
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Train model
      working-directory: ./mlops
      run: |
        python train_model.py
        
    - name: Verify model loading
      working-directory: ./mlops
      run: |
        python -c "
        import joblib
        import os
        import numpy as np
        
        # Verify model exists
        model_path = os.path.join(os.path.dirname(os.path.abspath('__file__')), 'model.pkl')
        assert os.path.exists(model_path), 'Model file not found'
        
        # Load model and test prediction
        model = joblib.load(model_path)
        sample = np.array([[5.1, 3.5, 1.4, 0.2]])
        prediction = model.predict(sample)
        print(f'Model loaded successfully. Sample prediction: {prediction}')
        "
        
    - name: Verify app startup
      working-directory: ./mlops
      run: |
        python -c "
        import importlib.util
        import sys
        
        # Import app.py as a module
        spec = importlib.util.spec_from_file_location('app', 'app.py')
        app_module = importlib.util.module_from_spec(spec)
        sys.modules['app'] = app_module
        spec.loader.exec_module(app_module)
        print('FastAPI application loaded successfully')
        "
        
    - name: Upload model artifact
      uses: actions/upload-artifact@v2
      with:
        name: iris-model
        path: ./mlops/model.pkl
