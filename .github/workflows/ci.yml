name: ML Model CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f mlops/requirements.txt ]; then pip install -r mlops/requirements.txt; fi
    
    - name: Test model training
      run: |
        cd mlops
        python -c "
        import os
        if not os.path.exists('iris_model.pkl'):
            print('Training model as it was not found...')
            import train_model
            train_model.train_iris_model()
        else:
            print('Model already exists: iris_model.pkl')
        "
    
    - name: Test model loading
      run: |
        cd mlops
        python -c "
        import joblib
        model = joblib.load('iris_model.pkl')
        print('Model loaded successfully!')
        print(f'Model type: {type(model).__name__}')
        "
    
    - name: Test FastAPI app
      run: |
        cd mlops
        python -c "
        import app
        print('FastAPI app imported successfully!')
        print(f'App routes: {[route.path for route in app.app.routes]}')
        "
    
    - name: Upload model as artifact
      uses: actions/upload-artifact@v3
      with:
        name: iris-model
        path: mlops/iris_model.pkl
